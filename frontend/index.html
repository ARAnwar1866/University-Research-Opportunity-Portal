<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">University Research Opportunity Portal</span>
      <button id="addBtn" class="btn btn-light">+ New Opportunity</button>
    </div>
  </nav>

  <main class="container pb-5">
    <div id="alerts"></div>
    <div id="list" class="row g-3"></div>
  </main>

  <!-- Details modal -->
  <div class="modal fade" id="detailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="detailsTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="detailsBody"></div>
    </div></div>
  </div>

  <!-- Create / edit modal -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog modal-lg"><div class="modal-content">
      <form id="oppForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="formTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="formError"></div>
          <div id="formFields"></div>
          <div class="mb-3 d-none" id="statusWrap">
            <label class="form-label" for="f_status">Status</label>
            <select class="form-select" id="f_status">
              <option>Open</option>
              <option>Closed</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
